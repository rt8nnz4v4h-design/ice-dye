<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>冰染 · Ice Dye</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14110d; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #e8dfcf;
    user-select: none;
    touch-action: none;
    -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; cursor: crosshair; }

  .hint {
    position: fixed;
    left: 50%; top: 34px;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: .12em;
    color: rgba(232,223,207,.62);
    pointer-events: none;
    transition: opacity .8s;
    text-align: center;
    line-height: 1.9;
    white-space: nowrap;
  }
  .hint b { font-weight: 500; color: rgba(232,223,207,.85); }
  .hint.off { opacity: 0; }

  .bar {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 12px;
    border-radius: 999px;
    background: rgba(28,25,21,.78);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    border: 1px solid rgba(255,245,225,.09);
    box-shadow: 0 12px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    max-width: calc(100vw - 24px);
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    z-index: 10;
  }
  .bar::-webkit-scrollbar { display: none; }

  .group { display: flex; align-items: center; gap: 5px; }
  .sep { width: 1px; height: 22px; background: rgba(255,245,225,.11); margin: 0 5px; flex: none; }

  .sw {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.14);
    cursor: pointer;
    position: relative;
    flex: none;
    transition: transform .16s cubic-bezier(.3,1.4,.5,1), box-shadow .2s, border-color .2s;
  }
  .sw:hover { transform: scale(1.12); }
  .sw.on { transform: scale(1.14); border-color: rgba(255,255,255,.9); box-shadow: 0 0 0 2px rgba(0,0,0,.5), 0 0 14px currentColor; }

  .subpanel {
    position: fixed;
    bottom: 66px;
    left: 50%;
    transform: translateX(-50%) translateY(6px);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 13px;
    border-radius: 999px;
    background: rgba(32,28,23,.92);
    backdrop-filter: blur(20px) saturate(1.3);
    -webkit-backdrop-filter: blur(20px) saturate(1.3);
    border: 1px solid rgba(255,245,225,.12);
    box-shadow: 0 14px 40px rgba(0,0,0,.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s, transform .16s;
    z-index: 30;
    white-space: nowrap;
  }
  .subpanel.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .subpanel .sw { width: 23px; height: 23px; }

  .btn {
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: rgba(232,223,207,.72);
    font: inherit;
    font-size: 12.5px;
    letter-spacing: .06em;
    cursor: pointer;
    white-space: nowrap;
    flex: none;
    transition: background .18s, color .18s;
  }
  .btn:hover { background: rgba(255,245,225,.09); color: #fff; }
  .btn.on { background: rgba(255,245,225,.16); color: #fff; }
  .btn:active { transform: translateY(1px); }

  .speeds { display: flex; align-items: center; gap: 2px; }
  .spd {
    width: 30px; height: 28px; border-radius: 8px; border: 0;
    background: transparent; color: rgba(232,223,207,.5);
    font: inherit; font-size: 11.5px; cursor: pointer; flex: none;
    transition: background .15s, color .15s;
  }
  .spd:hover { background: rgba(255,245,225,.08); color: #fff; }
  .spd.on { background: rgba(255,245,225,.16); color: #fff; }

  .toast {
    position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%) translateY(8px);
    padding: 8px 16px; border-radius: 999px;
    background: rgba(28,25,21,.9); border: 1px solid rgba(255,245,225,.1);
    font-size: 12px; letter-spacing: .08em; color: rgba(232,223,207,.85);
    opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; z-index: 20;
    white-space: nowrap;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 620px) {
    .btn { padding: 0 9px; font-size: 12px; }
    .sw { width: 23px; height: 23px; }
    .hint { font-size: 11.5px; letter-spacing: .06em; }
    .bar { gap: 4px; padding: 8px 9px; }
    .sep { margin: 0 2px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint" id="hint">布顶一条冰台 · 选色后<b>把染料撒在冰上</b> · 冰化成水，带着颜色往下渗</div>
<div class="bar" id="bar"></div>
<div class="subpanel" id="subpanel"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ────────────────────────────── 基础工具 ────────────────────────────── */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => (a + Math.random() * (b - a + 1)) | 0;
function hexToRgba(hex, a) {
  return `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
}

/* ────────────────────────────── 染料调色板 ────────────────────────────── */
/* 吸光度取自 -ln(rgb/255)，归一化后乘以强度 —— 模拟真实颜料的分层吸光 */
function makeDye(name, hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const ar = -Math.log(Math.max(r, 2) / 255);
  const ag = -Math.log(Math.max(g, 2) / 255);
  const ab = -Math.log(Math.max(b, 2) / 255);
  const m = Math.max(ar, ag, ab, 0.001);
  return {
    name, hex,
    ar: ar / m, ag: ag / m, ab: ab / m,
    depth: clamp(0.22 + m * 0.19, 0.22, 0.85),
  };
}

const FAMILIES = [
  { name: "靛蓝", colors: ["#9dc0e2", "#6f9fd0", "#3f6ea8", "#1b3a6b", "#12294c", "#0a1830"] },
  { name: "湖蓝", colors: ["#a8dcf0", "#6cc0e4", "#2f95c4", "#1f6f9e", "#164f75", "#0d3350"] },
  { name: "青碧", colors: ["#9ce6d8", "#4cc4ae", "#1f9a85", "#177f6e", "#0f5f54", "#0a3f38"] },
  { name: "苔绿", colors: ["#cfdf9c", "#9cb85c", "#77943a", "#5c7a2e", "#445c22", "#2d3d17"] },
  { name: "柠檬", colors: ["#f9edb8", "#eed35e", "#e0c034", "#d8b42a", "#a98b1f", "#7d6616"] },
  { name: "橙", colors: ["#f9c09c", "#ef9152", "#e57a35", "#d9662a", "#a94c1e", "#7d3715"] },
  { name: "玫红", colors: ["#f4b6cd", "#e46b96", "#d63f70", "#c2185b", "#941244", "#6b0d31"] },
  { name: "紫", colors: ["#d3b8e8", "#a97fcc", "#8a5db4", "#6a3d9a", "#4f2c74", "#381f54"] },
];

const DYES = [];
FAMILIES.forEach((f) => {
  f.colors.forEach((hex) => DYES.push(makeDye(f.name, hex)));
});

/* ────────────────────────────── 全局状态 ────────────────────────────── */
const stage = document.getElementById("stage");
const ctx = stage.getContext("2d", { alpha: false });
const hintEl = document.getElementById("hint");
const toastEl = document.getElementById("toast");
const barEl = document.getElementById("bar");
const subEl = document.getElementById("subpanel");

let DPR = 1;
let VW = 0, VH = 0;

const cloth = { x: 0, y: 0, w: 0, h: 0 };

let clothTex = null;
let clothTexW = 0, clothTexH = 0;

/* 场分辨率 —— 与布料同比例，低分辨率带来天然柔边 */
const FW = 320, FH = 400, NPX = FW * FH;
const dyeR = new Float32Array(NPX), dyeG = new Float32Array(NPX), dyeB = new Float32Array(NPX);
const depR = new Float32Array(NPX), depG = new Float32Array(NPX), depB = new Float32Array(NPX);
/* 干粉：撒在干布上的染料粉末，不扩散；遇水才溶成可流动的染液 */
const pdr = new Float32Array(NPX), pdg = new Float32Array(NPX), pdb = new Float32Array(NPX);
const wtr = new Float32Array(NPX);
const wetMark = new Float32Array(NPX);
const tR = new Float32Array(NPX), tG = new Float32Array(NPX), tB = new Float32Array(NPX), tW = new Float32Array(NPX);

/* 纤维密度扰动：平滑随机场，让染料边缘有织物毛糙感 */
const noiseF = new Float32Array(NPX);
{
  for (let i = 0; i < NPX; i++) noiseF[i] = Math.random() - 0.5;
  const tmp = new Float32Array(NPX);
  for (let p = 0; p < 4; p++) {
    for (let y = 1; y < FH - 1; y++) {
      const row = y * FW;
      for (let x = 1; x < FW - 1; x++) {
        const i = row + x;
        tmp[i] = (noiseF[i] * 4 + noiseF[i - 1] + noiseF[i + 1] + noiseF[i - FW] + noiseF[i + FW]) * 0.125;
      }
    }
    noiseF.set(tmp);
  }
  let mx = 1e-6;
  for (let i = 0; i < NPX; i++) { const a = Math.abs(noiseF[i]); if (a > mx) mx = a; }
  const inv = 1 / mx;
  for (let i = 0; i < NPX; i++) noiseF[i] *= inv;
}

/* 染料层离屏画布 */
const dyeCanvas = document.createElement("canvas");
dyeCanvas.width = FW; dyeCanvas.height = FH;
const dyeCtx = dyeCanvas.getContext("2d");
const dyeImg = dyeCtx.createImageData(FW, FH);

/* exp 查找表 */
const LUT_N = 1024, LUT_MAX = 9;
const EXP_LUT = new Float32Array(LUT_N + 1);
for (let i = 0; i <= LUT_N; i++) EXP_LUT[i] = Math.exp(-(i / LUT_N) * LUT_MAX);
const lutScale = LUT_N / LUT_MAX;
function fastExp(x) {
  let i = (x * lutScale) | 0;
  if (i < 0) i = 0; else if (i > LUT_N) i = LUT_N;
  return EXP_LUT[i];
}

/* 场景对象 */
let drops = [];
let specks = [];      // 撒落的染料粉末视觉粒子
let ripples = [];

let selectedDye = 3;
let tool = "dye";     // dye | water
let speedMul = 1;     // 0 暂停 / 1 / 2 / 4 / 8
let melting = false;
let washed = false;
let time = 0;
let washT = -1;       // 清洗动画进度

let pointer = { x: 0, y: 0, down: false, mode: null, ice: null, moved: false };
let lastTime = 0;

/* ────────────────────────────── 布局 ────────────────────────────── */
function layout() {
  VW = window.innerWidth;
  VH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  stage.width = Math.round(VW * DPR);
  stage.height = Math.round(VH * DPR);
  stage.style.width = VW + "px";
  stage.style.height = VH + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const pad = Math.max(18, Math.min(VW, VH) * 0.055);
  const barSpace = 96;
  let bh = Math.max(240, VH - pad * 2 - barSpace);
  let bw = bh * (FW / FH);
  if (bw > VW - pad * 2) {
    bw = Math.max(190, VW - pad * 2);
    bh = bw * (FH / FW);
  }
  bh = Math.min(bh, Math.max(240, VH - pad * 2 - barSpace));
  cloth.w = Math.round(bw);
  cloth.h = Math.round(bh);
  cloth.x = Math.round((VW - cloth.w) / 2);
  cloth.y = Math.round((VH - cloth.h) / 2 - barSpace * 0.28);

  if (Math.abs(clothTexW - cloth.w) > 40 || Math.abs(clothTexH - cloth.h) > 40 || !clothTex) {
    clothTex = makeCloth(cloth.w, cloth.h);
    clothTexW = cloth.w; clothTexH = cloth.h;
  }
}

/* ────────────────────────────── 布料纹理 ────────────────────────────── */
function makeCloth(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");

  g.fillStyle = "#efe9dd";
  g.fillRect(0, 0, w, h);

  const img = g.getImageData(0, 0, w, h);
  const d = img.data;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;

      // 斜纹织造：细密的 45° 明暗
      const tw = Math.sin((x - y * 0.62) * 2.35) * 3.6 + Math.sin((x + y * 0.2) * 11.0) * 1.8;
      // 经纬纤维起伏
      const fib = (Math.sin(y * 1.7 + x * 0.035) + Math.sin(x * 1.9 + y * 0.03)) * 2.8;
      // 逐像素颗粒
      const grain = (Math.random() - 0.5) * 12;

      const v = tw + fib + grain;
      d[i] = clamp(d[i] + v, 0, 255);
      d[i + 1] = clamp(d[i + 1] + v * 0.97, 0, 255);
      d[i + 2] = clamp(d[i + 2] + v * 0.88, 0, 255);
    }
  }
  g.putImageData(img, 0, 0);

  // 稀疏的长纤维毛羽
  g.save();
  g.globalAlpha = 0.05;
  g.lineWidth = 1;
  for (let n = 0; n < (w * h) / 900; n++) {
    const x = Math.random() * w, y = Math.random() * h;
    const a = Math.random() * TAU, len = rand(4, 26);
    g.strokeStyle = Math.random() < 0.5 ? "#ffffff" : "#b9ac95";
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    g.stroke();
  }
  g.restore();

  // 四边做旧：轻微变暗 + 毛边
  const ri = Math.max(1, Math.min(w, h) * 0.28);
  const ro = Math.max(ri + 1, Math.max(w, h) * 0.78);
  const edge = g.createRadialGradient(w / 2, h / 2, ri, w / 2, h / 2, ro);
  edge.addColorStop(0, "rgba(0,0,0,0)");
  edge.addColorStop(1, "rgba(86,70,48,0.14)");
  g.fillStyle = edge;
  g.fillRect(0, 0, w, h);

  return c;
}

/* ────────────────────────────── 顶部冰台 ────────────────────────────── */
/* 冰只堆在布顶的一条窄台上，化成水后带着染料顺布面往下流 */

const tray = { x: 0, y: 0, w: 0, h: 0 };

function layoutTray() {
  const pad = Math.min(cloth.w, cloth.h) * 0.03;
  tray.x = cloth.x + pad;
  tray.w = cloth.w - pad * 2;
  tray.y = cloth.y + pad * 0.35;
  tray.h = cloth.h * 0.12;
}

function inTray(x, y) {
  return x >= tray.x - 24 && x <= tray.x + tray.w + 24 &&
         y >= tray.y - 40 && y <= tray.y + tray.h + 44;
}

function makeIceShape() {
  const n = randi(8, 12);
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + rand(-0.1, 0.1);
    const rr = rand(0.78, 1.12);
    pts.push([Math.cos(a) * rr, Math.sin(a) * rr * rand(0.9, 1.06)]);
  }
  return pts;
}

class Ice {
  constructor(x, y, r) {
    this.x = x; this.y = y;
    this.r0 = r;
    this.vol = 1;
    this.shape = makeIceShape();
    this.bubbles = [];
    for (let i = 0; i < randi(4, 8); i++) {
      const a = Math.random() * TAU, d = Math.random() * 0.6;
      this.bubbles.push([Math.cos(a) * d, Math.sin(a) * d, rand(0.6, 2.0)]);
    }
    this.facets = [];
    for (let i = 0; i < 3; i++) {
      this.facets.push({ a0: Math.random() * TAU, a1: Math.random() * TAU, alpha: rand(0.04, 0.12) });
    }
    this.cr = 0; this.cg = 0; this.cb = 0; this.cAmt = 0;
    this.dust = [];
    this.dripAcc = 0;
    this.wobble = Math.random() * TAU;
    this.dead = false;
    // 滴水口：冰底部若干处固定出水点，融水会在这里连成细流
    this.spouts = [];
    const nS = randi(3, 6);
    for (let i = 0; i < nS; i++) {
      this.spouts.push({ dx: rand(-0.72, 0.72), dy: rand(0.15, 0.85) });
    }
  }
  get radius() { return this.r0 * Math.cbrt(Math.max(this.vol, 0)); }
  hit(x, y) {
    const dx = x - this.x, dy = y - this.y;
    return dx * dx + dy * dy < (this.r0 * 1.02) ** 2;
  }
}

let ices = [];

function addIceAt(x, y, r) {
  ices.push(new Ice(x, y, r));
}

function seedScene() {
  drops = [];
  specks = [];
  ripples = [];
  ices = [];
  layoutTray();
  const n = randi(5, 7);
  const step = tray.w / n;
  for (let i = 0; i < n; i++) {
    addIceAt(
      tray.x + step * (i + rand(0.2, 0.8)),
      tray.y + tray.h * rand(0.28, 0.58),
      tray.h * rand(0.40, 0.72)
    );
  }
}

function addIce() {
  ices = [];
  const n = 6;
  const step = tray.w / n;
  for (let i = 0; i < n; i++) {
    addIceAt(
      tray.x + step * (i + 0.5) + rand(-5, 5),
      tray.y + tray.h * rand(0.35, 0.55),
      tray.h * rand(0.46, 0.66)
    );
  }
}

/* ────────────────────────────── 坐标转换 ────────────────────────────── */
function toField(sx, sy) {
  return {
    x: ((sx - cloth.x) / cloth.w) * FW,
    y: ((sy - cloth.y) / cloth.h) * FH,
  };
}
function inCloth(sx, sy) {
  return sx >= cloth.x && sx <= cloth.x + cloth.w && sy >= cloth.y && sy <= cloth.y + cloth.h;
}

/* ────────────────────────────── 注入染料 / 水 ────────────────────────────── */
function injectDye(fx, fy, radius, dye, amt) {
  const R = radius;
  const x0 = Math.max(1, Math.floor(fx - R)), x1 = Math.min(FW - 2, Math.ceil(fx + R));
  const y0 = Math.max(1, Math.floor(fy - R)), y1 = Math.min(FH - 2, Math.ceil(fy + R));
  const inv = 1 / (R * R * 0.55);
  const ar = dye.ar * amt, ag = dye.ag * amt, ab = dye.ab * amt;
  const st = dye.depth;
  for (let y = y0; y <= y1; y++) {
    const dy = y - fy, dy2 = dy * dy;
    const row = y * FW;
    for (let x = x0; x <= x1; x++) {
      const dx = x - fx;
      const d2 = dx * dx + dy2;
      if (d2 > R * R) continue;
      const w = Math.exp(-d2 * inv);
      const i = row + x;
      dyeR[i] = Math.min(2.0, dyeR[i] + ar * w * st);
      dyeG[i] = Math.min(2.0, dyeG[i] + ag * w * st);
      dyeB[i] = Math.min(2.0, dyeB[i] + ab * w * st);
      wtr[i] = Math.min(3, wtr[i] + amt * 0.42 * w);
    }
  }
}

/* 干粉：直接落在布上的染料粉末，本身不扩散，只有被水浸到才会化开 */
function injectPowder(fx, fy, radius, dye, amt) {
  const R = radius;
  const x0 = Math.max(1, Math.floor(fx - R)), x1 = Math.min(FW - 2, Math.ceil(fx + R));
  const y0 = Math.max(1, Math.floor(fy - R)), y1 = Math.min(FH - 2, Math.ceil(fy + R));
  const inv = 1 / (R * R * 0.55);
  const ar = dye.ar * dye.depth * amt;
  const ag = dye.ag * dye.depth * amt;
  const ab = dye.ab * dye.depth * amt;
  const st = dye.depth;
  for (let y = y0; y <= y1; y++) {
    const dy = y - fy, dy2 = dy * dy;
    const row = y * FW;
    for (let x = x0; x <= x1; x++) {
      const dx = x - fx;
      const d2 = dx * dx + dy2;
      if (d2 > R * R) continue;
      const w = Math.exp(-d2 * inv);
      const i = row + x;
      pdr[i] = Math.min(2.4, pdr[i] + ar * w * st);
      pdg[i] = Math.min(2.4, pdg[i] + ag * w * st);
      pdb[i] = Math.min(2.4, pdb[i] + ab * w * st);
    }
  }
}

function injectWater(fx, fy, radius, amt) {  const R = radius;
  const x0 = Math.max(1, Math.floor(fx - R)), x1 = Math.min(FW - 2, Math.ceil(fx + R));
  const y0 = Math.max(1, Math.floor(fy - R)), y1 = Math.min(FH - 2, Math.ceil(fy + R));
  const inv = 1 / (R * R * 0.55);
  for (let y = y0; y <= y1; y++) {
    const dy = y - fy, dy2 = dy * dy;
    const row = y * FW;
    for (let x = x0; x <= x1; x++) {
      const dx = x - fx;
      const d2 = dx * dx + dy2;
      if (d2 > R * R) continue;
      const w = Math.exp(-d2 * inv);
      const i = row + x;
      wtr[i] = Math.min(3.2, wtr[i] + amt * w);
    }
  }
}

/* ────────────────────────────── 场演算 ────────────────────────────── */
function stepField(k) {
  if (k <= 0) return;

  const evap = Math.pow(0.99994, k);

  // 1) 扩散：各向同性为主，让落点向四周渗开成宽斑，只留一点向下倾斜
  const dV = Math.min(0.30, 0.20 * k);
  const dH = Math.min(0.16, 0.085 * k);
  const dWV = Math.min(0.26, 0.14 * k);
  const dWH = Math.min(0.10, 0.03 * k);
  for (let y = 1; y < FH - 1; y++) {
    const row = y * FW;
    for (let x = 1; x < FW - 1; x++) {
      const i = row + x;
      const l = i - 1, r = i + 1, u = i - FW, d = i + FW;
      const wetM = 0.35 + Math.min(wtr[i], 1) * 0.65;
      tR[i] = dyeR[i] + dV * wetM * ((dyeR[u] + dyeR[d]) * 0.5 - dyeR[i]) + dH * wetM * ((dyeR[l] + dyeR[r]) * 0.5 - dyeR[i]);
      tG[i] = dyeG[i] + dV * wetM * ((dyeG[u] + dyeG[d]) * 0.5 - dyeG[i]) + dH * wetM * ((dyeG[l] + dyeG[r]) * 0.5 - dyeG[i]);
      tB[i] = dyeB[i] + dV * wetM * ((dyeB[u] + dyeB[d]) * 0.5 - dyeB[i]) + dH * wetM * ((dyeB[l] + dyeB[r]) * 0.5 - dyeB[i]);
      tW[i] = wtr[i] + dWV * ((wtr[u] + wtr[d]) * 0.5 - wtr[i]) + dWH * ((wtr[l] + wtr[r]) * 0.5 - wtr[i]);
    }
  }
  copyBorders();

  // 2) 重力下移 + 边缘沉积 + 蒸发
  for (let y = FH - 2; y >= 1; y--) {
    const row = y * FW;
    for (let x = 1; x < FW - 1; x++) {
      const i = row + x;

      // 水往低处走：水越多，带着染料向下涌得越快
      const up = i - FW;
      const f = Math.min(0.55, (0.02 + Math.min(tW[i], 1.8) * 0.28) * k);
      let r = tR[i] * (1 - f) + tR[up] * f;
      let g = tG[i] * (1 - f) + tG[up] * f;
      let b = tB[i] * (1 - f) + tB[up] * f;

      dyeR[i] = r; dyeG[i] = g; dyeB[i] = b;

      // 水量：向下汇集 + 蒸发
      const wv = (tW[i] * (1 - f * 0.7) + tW[up] * f * 0.7) * evap;
      wtr[i] = Math.max(0, wv);
      if (wv > wetMark[i]) wetMark[i] = wv;

      // 干粉遇水才化开（只作用于干粉，已固色的染料永远不动）
      if (wv > 0.12 && (pdr[i] + pdg[i] + pdb[i]) > 0.00002) {
        const diss = Math.min(0.05 * k, 0.5);
        const t1 = pdr[i] * diss, t2 = pdg[i] * diss, t3 = pdb[i] * diss;
        pdr[i] -= t1; pdg[i] -= t2; pdb[i] -= t3;
        dyeR[i] = Math.min(2.4, dyeR[i] + t1);
        dyeG[i] = Math.min(2.4, dyeG[i] + t2);
        dyeB[i] = Math.min(2.4, dyeB[i] + t3);
      }

      // 边缘沉积：浓度梯度大 / 布越干 → 沉积越多
      const curR = dyeR[i], curG = dyeG[i], curB = dyeB[i];
      if (curR > 0.002 || curG > 0.002 || curB > 0.002) {
        const gl = tR[i - 1], gr = tR[i + 1], gu = tR[i - FW], gd = tR[i + FW];
        const grad =
          Math.abs(gl - gr) + Math.abs(gu - gd) +
          Math.abs(tG[i - 1] - tG[i + 1]) + Math.abs(tG[i - FW] - tG[i + FW]) +
          Math.abs(tB[i - 1] - tB[i + 1]) + Math.abs(tB[i - FW] - tB[i + FW]);

        const dryness = 1 - clamp(wv, 0, 1);
        const rate = clamp(0.00010 * (0.6 + dryness * 1.2) * k, 0, 0.05);

        if (rate > 0.0001) {
          const dr = curR * rate, dg = curG * rate, db = curB * rate;
          depR[i] += dr; depG[i] += dg; depB[i] += db;
          dyeR[i] = curR - dr; dyeG[i] = curG - dg; dyeB[i] = curB - db;
        }
      }
    }
  }
}

function copyBorders() {
  // 上下
  for (let x = 0; x < FW; x++) {
    let i = x, j = (FH - 1) * FW + x;
    tR[i] = dyeR[i]; tG[i] = dyeG[i]; tB[i] = dyeB[i]; tW[i] = wtr[i];
    tR[j] = dyeR[j]; tG[j] = dyeG[j]; tB[j] = dyeB[j]; tW[j] = wtr[j];
  }
  // 左右
  for (let y = 0; y < FH; y++) {
    let i = y * FW, j = y * FW + FW - 1;
    tR[i] = dyeR[i]; tG[i] = dyeG[i]; tB[i] = dyeB[i]; tW[i] = wtr[i];
    tR[j] = dyeR[j]; tG[j] = dyeG[j]; tB[j] = dyeB[j]; tW[j] = wtr[j];
  }
}

/* ────────────────────────────── 融化与水滴 ────────────────────────────── */
function updateIces(simDt) {
  if (!melting) return;
  const baseMelt = 0.0107 / 1000;

  for (const ice of ices) {
    if (ice.vol <= 0) continue;
    const rad = ice.radius;
    const surf = (rad / ice.r0) ** 2;
    ice.vol -= baseMelt * surf * simDt;

    ice.dripAcc += simDt * (0.00032 + 0.00080 * surf);
    let guard = 0;
    while (ice.dripAcc > 1 && guard++ < 4) {
      ice.dripAcc -= 1;
      spawnDrop(ice);
    }

    if (ice.vol <= 0) {
      ice.vol = 0;
      flushIceDye(ice);
      ice.dead = true;
    }
  }
  ices = ices.filter((i) => !i.dead);
}

function spawnDrop(ice) {
  const rad = ice.radius;
  const sp = ice.spouts.length
    ? ice.spouts[(Math.random() * ice.spouts.length) | 0]
    : { dx: 0, dy: 0.6 };
  const x = ice.x + (sp.dx + rand(-0.05, 0.05)) * rad;

  let cr = 0, cg = 0, cb = 0, amt = 0;
  if (ice.dust.length && ice.cAmt > 0.002) {
    let best = null, bd = 1e9;
    for (const d of ice.dust) {
      if (d.amt < 0.02) continue;
      const dd = Math.abs(d.x - x);
      if (dd < bd) { bd = dd; best = d; }
    }
    if (best) {
      const share = 0.0035 + 0.0080 * Math.random();
      amt = best.amt * share;
      cr = best.cr * share; cg = best.cg * share; cb = best.cb * share;
      best.amt -= amt; best.cr -= cr; best.cg -= cg; best.cb -= cb;
      ice.cAmt -= amt;
      ice.cr -= cr; ice.cg -= cg; ice.cb -= cb;
    }
  }

  drops.push({
    x,
    y: ice.y + rad * rand(0.35, 0.85),
    targetY: cloth.y + rand(4, 18),
    vy: rand(20, 60),
    cr, cg, cb, amt,
    R: 4.2 + Math.random() * 2.0,
    size: rand(1.3, 2.7),
  });
}

function flushIceDye(ice) {
  // 冰化尽时剩余的高浓染料若一次性倾倒也成黑斑，直接丢弃（此前的滴落已释放绝大部分）
  ice.cAmt = 0; ice.cr = ice.cg = ice.cb = 0;
  ice.dust.length = 0;
}

function splat(fx, fy, R, cr, cg, cb, addWater) {
  const x0 = Math.max(1, Math.floor(fx - R)), x1 = Math.min(FW - 2, Math.ceil(fx + R));
  const y0 = Math.max(1, Math.floor(fy - R)), y1 = Math.min(FH - 2, Math.ceil(fy + R));
  const inv = 1 / (R * R * 0.6);
  for (let y = y0; y <= y1; y++) {
    const dy = y - fy;
    const row = y * FW;
    for (let x = x0; x <= x1; x++) {
      const dx = x - fx;
      const d2 = dx * dx + dy * dy;
      if (d2 > R * R) continue;
      const w = Math.exp(-d2 * inv);
      const i = row + x;
      dyeR[i] = Math.min(2.0, dyeR[i] + cr * w);
      dyeG[i] = Math.min(2.0, dyeG[i] + cg * w);
      dyeB[i] = Math.min(2.0, dyeB[i] + cb * w);
      wtr[i] = Math.min(3.0, wtr[i] + addWater * w);
    }
  }
}

function updateDrops(simDt) {
  const dtSec = simDt / 1000;

  for (let n = drops.length - 1; n >= 0; n--) {
    const d = drops[n];
    d.vy += 900 * dtSec;
    d.y += d.vy * dtSec;
    if (d.y < d.targetY) continue;

    // 落地：像手撒在布上那样，成一个宽而不规则的渗斑
    const f = toField(d.x, d.y);
    for (let k = 0; k < 3; k++) {
      const R = 8 + Math.random() * 5;
      splat(
        f.x + rand(-11, 11),
        f.y + rand(-5, 13),
        R,
        d.cr * 0.38, d.cg * 0.38, d.cb * 0.38,
        1.2
      );
    }
    ripples.push({ x: d.x, y: d.y, r: d.size, life: 1 });
    drops.splice(n, 1);
  }
}

/* ────────────────────────────── 粉末视觉粒子 ────────────────────────────── */
function updateSpecks(simDt) {
  const dtSec = simDt / 1000;
  for (let n = specks.length - 1; n >= 0; n--) {
    const s = specks[n];
    s.life -= dtSec * (0.35 + s.dissolve);
    if (s.life <= 0) { specks.splice(n, 1); continue; }
    s.x += s.vx * dtSec * 12;
    s.y += s.vy * dtSec * 12;
    s.vx *= 0.94; s.vy *= 0.94;
  }
  for (let n = ripples.length - 1; n >= 0; n--) {
    const r = ripples[n];
    r.life -= dtSec * 2.2;
    r.r += dtSec * 26;
    if (r.life <= 0) ripples.splice(n, 1);
  }
}

/* ────────────────────────────── 撒料行为 ────────────────────────────── */
let lastDab = { x: 0, y: 0, t: 0 };

function dabDye(sx, sy, strength) {
  if (!inCloth(sx, sy)) return;
  const dye = DYES[selectedDye];

  // 撒在冰上 → 记在冰面这一处，随融水一起下去
  for (const ice of ices) {
    if (ice.vol <= 0.05 || !ice.hit(sx, sy)) continue;
    const amt = strength * 220;
    const cr = dye.ar * dye.depth * amt;
    const cg = dye.ag * dye.depth * amt;
    const cb = dye.ab * dye.depth * amt;

    let merged = false;
    const from = Math.max(0, ice.dust.length - 40);
    for (let i = ice.dust.length - 1; i >= from; i--) {
      const d = ice.dust[i];
      if (d.hex === dye.hex && Math.abs(d.x - sx) < 15 && Math.abs(d.y - sy) < 15) {
        d.amt += amt; d.cr += cr; d.cg += cg; d.cb += cb;
        merged = true;
        break;
      }
    }
    if (!merged) ice.dust.push({ x: sx, y: sy, cr, cg, cb, amt, hex: dye.hex });

    ice.cAmt += amt;
    ice.cr += cr; ice.cg += cg; ice.cb += cb;
    spawnSpecks(sx, sy, dye, 5);
    return;
  }

  const f = toField(sx, sy);
  for (let k = 0; k < 6; k++) {
    const ox = rand(-12, 12), oy = rand(-12, 12);
    const R = (14 + Math.random() * 6) * rand(0.7, 1);
    injectPowder(clamp(f.x + ox, 2, FW - 3), clamp(f.y + oy, 2, FH - 3), R, dye, strength * 0.26);
  }
  spawnSpecks(sx, sy, dye, 5);
}

function spawnSpecks(sx, sy, dye, n) {
  const c = dye.hex;
  for (let i = 0; i < n; i++) {
    specks.push({
      x: sx + rand(-16, 16),
      y: sy + rand(-16, 16),
      vx: rand(-1.4, 1.4), vy: rand(-1.4, 1.4),
      size: rand(0.8, 2.6),
      life: 1,
      dissolve: rand(0.5, 1.6),
      color: c,
    });
  }
}

function dabWater(sx, sy) {
  if (!inCloth(sx, sy)) return;
  const f = toField(sx, sy);
  injectWater(f.x, f.y, 5.5, 0.42);
  ripples.push({ x: sx, y: sy, r: 3, life: 0.9 });
}

/* ────────────────────────────── 渲染 ────────────────────────────── */
function render() {
  const t = performance.now() * 0.001;

  // 工作台背景
  const bg = ctx.createRadialGradient(VW * 0.5, VH * 0.42, 20, VW * 0.5, VH * 0.5, Math.max(VW, VH) * 0.85);
  bg.addColorStop(0, "#262019");
  bg.addColorStop(0.55, "#191510");
  bg.addColorStop(1, "#0d0b09");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, VW, VH);

  // 布料阴影
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.75)";
  ctx.shadowBlur = 48;
  ctx.shadowOffsetY = 16;
  ctx.fillStyle = "#0a0806";
  ctx.fillRect(cloth.x, cloth.y, cloth.w, cloth.h);
  ctx.restore();

  // 布料
  ctx.drawImage(clothTex, cloth.x, cloth.y, cloth.w, cloth.h);

  // 顶部冰台底衬
  const tg = ctx.createLinearGradient(0, tray.y - 12, 0, tray.y + tray.h + 14);
  tg.addColorStop(0, "rgba(188,212,232,0)");
  tg.addColorStop(0.45, "rgba(188,212,232,0.10)");
  tg.addColorStop(1, "rgba(188,212,232,0)");
  ctx.fillStyle = tg;
  ctx.fillRect(cloth.x, tray.y - 12, cloth.w, tray.h + 26);

  // 冰的投影（画在布上、染料之下）
  ctx.save();
  for (const ice of ices) {
    if (ice.vol <= 0) continue;
    const r = ice.radius;
    const sg = ctx.createRadialGradient(ice.x, ice.y + r * 0.5, r * 0.15, ice.x, ice.y + r * 0.5, r * 1.3);
    sg.addColorStop(0, "rgba(24,38,54,0.26)");
    sg.addColorStop(0.55, "rgba(24,38,54,0.10)");
    sg.addColorStop(1, "rgba(24,38,54,0)");
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.ellipse(ice.x, ice.y + r * 0.52, r * 1.2, r * 0.55, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  // 染料层
  renderDyeLayer();
  ctx.save();
  ctx.beginPath();
  ctx.rect(cloth.x, cloth.y, cloth.w, cloth.h);
  ctx.clip();
  ctx.globalCompositeOperation = "multiply";
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(dyeCanvas, cloth.x, cloth.y, cloth.w, cloth.h);
  ctx.globalCompositeOperation = "source-over";

  // 湿区光泽
  renderWetSheen();

  // 涟漪
  for (const rp of ripples) {
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, rp.r, 0, TAU);
    ctx.strokeStyle = `rgba(255,255,255,${0.16 * rp.life})`;
    ctx.lineWidth = 1.1;
    ctx.stroke();
  }

  // 染料粉末
  for (const s of specks) {
    ctx.globalAlpha = clamp(s.life, 0, 1) * 0.85;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // 冰块
  for (const ice of ices) {
    if (ice.vol > 0.002) drawIce(ice, t);
  }

  // 水滴
  for (const d of drops) drawDrop(d);

  // 布料毛边
  drawClothEdge();

  // 清洗白闪
  if (washT >= 0) {
    const p = clamp(washT, 0, 1);
    const a = Math.sin(p * Math.PI) * 0.5;
    ctx.fillStyle = `rgba(236,246,255,${a * 0.42})`;
    ctx.fillRect(cloth.x, cloth.y, cloth.w, cloth.h);
  }
}

function renderDyeLayer() {
  const d = dyeImg.data;
  const damp = washT >= 0 ? 1 : 0;

  for (let i = 0; i < NPX; i++) {
    const wv = wtr[i];
    // 湿布微暗且有水光
    const wet = wv > 0.02 ? 1 - Math.min(wv, 1) * 0.06 : 1;

    const nz = (1 + noiseF[i] * 0.18) * 1.3;
    const wm = Math.min(wetMark[i], 1) * 0.012;
    const ar = Math.min(1.7, (depR[i] + dyeR[i] + pdr[i]) * nz + wm);
    const ag = Math.min(1.7, (depG[i] + dyeG[i] + pdg[i]) * nz + wm);
    const ab = Math.min(1.7, (depB[i] + dyeB[i] + pdb[i]) * nz + wm * 0.9);

    const j = i << 2;
    d[j]     = (fastExp(ar) * 255 * wet) | 0;
    d[j + 1] = (fastExp(ag) * 255 * wet) | 0;
    d[j + 2] = (fastExp(ab) * 255 * wet) | 0;
    d[j + 3] = 255;
  }
  dyeCtx.putImageData(dyeImg, 0, 0);
}

function renderWetSheen() {
  // 用低分辨率水场生成一张柔和的高光/压暗图
  const w = FW, h = FH;
  const img = sheenImg;
  const d = img.data;
  let any = false;
  for (let i = 0; i < NPX; i++) {
    const v = wtr[i];
    const j = i << 2;
    if (v > 0.06) {
      any = true;
      // 湿：轻微压暗中心 + 边缘提亮模拟反射
      const a = Math.min(v, 1.2) * 34;
      d[j] = 255; d[j + 1] = 255; d[j + 2] = 255;
      d[j + 3] = a | 0;
    } else {
      d[j + 3] = 0;
    }
  }
  if (!any) return;
  sheenCtx.putImageData(img, 0, 0);
  ctx.globalCompositeOperation = "overlay";
  ctx.globalAlpha = 0.5;
  ctx.drawImage(sheenCanvas, cloth.x, cloth.y, cloth.w, cloth.h);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

const sheenCanvas = document.createElement("canvas");
sheenCanvas.width = FW; sheenCanvas.height = FH;
const sheenCtx = sheenCanvas.getContext("2d");
const sheenImg = sheenCtx.createImageData(FW, FH);

function drawIce(ice, t) {
  const r = ice.radius;
  if (r < 1) return;
  const pts = ice.shape;
  const n = pts.length;

  ctx.save();
  ctx.translate(ice.x, ice.y);

  const wob = Math.sin(t * 0.7 + ice.wobble) * 0.008;

  const trace = () => {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const p = pts[i];
      const sx = p[0] * r * (1 + wob);
      const sy = p[1] * r * (1 + wob);
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.closePath();
  };

  trace();
  const g = ctx.createLinearGradient(-r * 0.4, -r, r * 0.4, r);
  g.addColorStop(0, "rgba(250,253,255,0.82)");
  g.addColorStop(0.45, "rgba(216,238,250,0.64)");
  g.addColorStop(1, "rgba(172,206,230,0.56)");
  ctx.fillStyle = g;
  ctx.fill();

  ctx.save();
  ctx.clip();

  for (const f of ice.facets) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(f.a0) * r * 0.9, Math.sin(f.a0) * r * 0.9);
    ctx.lineTo(Math.cos(f.a1) * r * 0.9, Math.sin(f.a1) * r * 0.9);
    ctx.closePath();
    ctx.fillStyle = `rgba(255,255,255,${f.alpha})`;
    ctx.fill();
  }

  for (const b of ice.bubbles) {
    ctx.beginPath();
    ctx.arc(b[0] * r, b[1] * r, b[2], 0, TAU);
    ctx.fillStyle = "rgba(255,255,255,0.42)";
    ctx.fill();
  }

  for (const d of ice.dust) {
    if (d.amt < 0.05) continue;
    const px = d.x - ice.x, py = d.y - ice.y;
    const a = clamp(0.20 + d.amt * 0.004, 0, 0.62);
    ctx.beginPath();
    ctx.arc(px, py, r * 0.30, 0, TAU);
    ctx.fillStyle = hexToRgba(d.hex, a * 0.24);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px, py, r * 0.12, 0, TAU);
    ctx.fillStyle = hexToRgba(d.hex, a);
    ctx.fill();
  }

  ctx.restore();

  // 顶部薄霜
  ctx.beginPath();
  ctx.ellipse(-r * 0.18, -r * 0.34, r * 0.44, r * 0.18, -0.5, Math.PI, TAU);
  const hl = ctx.createLinearGradient(-r * 0.18, -r * 0.54, -r * 0.18, -r * 0.1);
  hl.addColorStop(0, "rgba(255,255,255,0.58)");
  hl.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = hl;
  ctx.fill();

  trace();
  ctx.strokeStyle = "rgba(255,255,255,0.46)";
  ctx.lineWidth = 1.1;
  ctx.stroke();

  ctx.restore();
}

function drawDrop(d) {
  const r = d.size;
  if (d.onCloth) {
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, r * 0.9, r * 0.68, 0, 0, TAU);
    ctx.fillStyle = "rgba(232,244,255,0.22)";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(d.x - r * 0.2, d.y - r * 0.18, r * 0.26, 0, TAU);
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.fill();
    return;
  }
  ctx.beginPath();
  ctx.moveTo(d.x, d.y - r * 1.9);
  ctx.quadraticCurveTo(d.x + r, d.y - r * 0.2, d.x, d.y + r);
  ctx.quadraticCurveTo(d.x - r, d.y - r * 0.2, d.x, d.y - r * 1.9);
  const g = ctx.createLinearGradient(d.x, d.y - r * 2, d.x, d.y + r);
  g.addColorStop(0, "rgba(255,255,255,0.85)");
  g.addColorStop(1, "rgba(198,226,244,0.55)");
  ctx.fillStyle = g;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(d.x - r * 0.22, d.y - r * 0.35, r * 0.32, 0, TAU);
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fill();
}

function drawClothEdge() {
  ctx.save();
  ctx.strokeStyle = "rgba(255,248,235,0.10)";
  ctx.lineWidth = 1;
  ctx.strokeRect(cloth.x + 0.5, cloth.y + 0.5, cloth.w - 1, cloth.h - 1);

  // 毛边：沿四边抖动的短纤维
  ctx.strokeStyle = "rgba(238,228,208,0.16)";
  ctx.lineWidth = 1;
  const step = 7;
  for (let x = cloth.x; x < cloth.x + cloth.w; x += step) {
    const j = Math.sin(x * 0.37) * 1.5;
    ctx.beginPath(); ctx.moveTo(x, cloth.y - 1); ctx.lineTo(x + j, cloth.y - rand(1, 4)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, cloth.y + cloth.h + 1); ctx.lineTo(x + j, cloth.y + cloth.h + rand(1, 4)); ctx.stroke();
  }
  for (let y = cloth.y; y < cloth.y + cloth.h; y += step) {
    const j = Math.sin(y * 0.41) * 1.5;
    ctx.beginPath(); ctx.moveTo(cloth.x - 1, y); ctx.lineTo(cloth.x - rand(1, 4), y + j); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cloth.x + cloth.w + 1, y); ctx.lineTo(cloth.x + cloth.w + rand(1, 4), y + j); ctx.stroke();
  }
  ctx.restore();
}

/* ────────────────────────────── 主循环 ────────────────────────────── */
function frame(now) {
  if (!lastTime) lastTime = now;
  let dt = now - lastTime;
  lastTime = now;
  if (dt > 60) dt = 60;
  if (dt < 0) dt = 0;

  const simDt = dt * speedMul;
  const k = simDt / 16.667;

  time += dt * 0.001;

  if (speedMul > 0) {
    updateIces(simDt);
    updateDrops(simDt);
    updateSpecks(simDt);
    stepField(k);
  }

  // 清洗动画
  if (washT >= 0) {
    washT += dt / 900;
    if (washT >= 1) {
      washT = -1;
      for (let i = 0; i < NPX; i++) {
        dyeR[i] = 0; dyeG[i] = 0; dyeB[i] = 0;
        wtr[i] = 0;
        wetMark[i] = 0;
        pdr[i] = 0; pdg[i] = 0; pdb[i] = 0;
        depR[i] *= 0.82; depG[i] *= 0.82; depB[i] *= 0.82;
      }
      specks.length = 0;
      drops.length = 0;
      washed = true;
    }
  }

  // 持续按住撒料
  if (pointer.down && pointer.mode === "dab" && speedMul > 0) {
    const st = clamp(dt / 16.667, 0, 3);
    if (tool === "water") dabWater(pointer.x, pointer.y);
    else dabDye(pointer.x, pointer.y, 0.28 * st);
  }

  render();
  requestAnimationFrame(frame);
}

/* ────────────────────────────── 交互 ────────────────────────────── */
function pos(e) {
  const r = stage.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

stage.addEventListener("pointerdown", (e) => {
  const p = pos(e);
  pointer.x = p.x; pointer.y = p.y; pointer.down = true; pointer.moved = false;
  hideHint();

  if (tool === "ice") {
    if (inTray(p.x, p.y)) {
      addIceAt(
        clamp(p.x, tray.x + 12, tray.x + tray.w - 12),
        clamp(p.y, tray.y + 6, tray.y + tray.h * 0.78),
        tray.h * rand(0.44, 0.66)
      );
      if (!melting) setMelting(true);
    }
    return;
  }

  if (!melting) setMelting(true);

  pointer.mode = "dab";
  if (tool === "water") dabWater(p.x, p.y);
  else dabDye(p.x, p.y, 2.3);
  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener("pointermove", (e) => {
  const p = pos(e);

  if (pointer.down && pointer.mode === "dab") {
    const dx = p.x - pointer.x, dy = p.y - pointer.y;
    const dist = Math.hypot(dx, dy);
    const steps = Math.max(1, Math.ceil(dist / 6));
    for (let s = 0; s < steps; s++) {
      const x = lerp(pointer.x, p.x, s / steps);
      const y = lerp(pointer.y, p.y, s / steps);
      if (speedMul > 0) {
        if (tool === "water") dabWater(x, y);
        else dabDye(x, y, 1.0);
      }
    }
  }
  pointer.x = p.x; pointer.y = p.y;
});

function endStroke() {
  pointer.down = false;
  pointer.mode = null;
  pointer.ice = null;
  stage.style.cursor = "crosshair";
}
stage.addEventListener("pointerup", endStroke);
stage.addEventListener("pointercancel", endStroke);
stage.addEventListener("pointerleave", () => { if (!pointer.down) pointer.x = -999; });

/* ────────────────────────────── UI ────────────────────────────── */
function buildBar() {
  barEl.innerHTML = "";

  const dyeGroup = document.createElement("div");
  dyeGroup.className = "group";
  FAMILIES.forEach((f, fi) => {
    const b = document.createElement("button");
    b.className = "sw" + (Math.floor(selectedDye / 6) === fi ? " on" : "");
    b.style.background = f.colors[3];
    b.style.color = f.colors[3];
    b.title = f.name;
    b.dataset.fam = fi;
    b.onclick = (e) => {
      e.stopPropagation();
      tool = "dye";
      if (Math.floor(selectedDye / 6) !== fi) selectedDye = fi * 6 + 3;
      openSub(fi, b);
      refreshBar();
      hideHint();
    };
    dyeGroup.appendChild(b);
  });
  barEl.appendChild(dyeGroup);

  barEl.appendChild(sepEl());

  const waterBtn = mkBtn("喷水", () => {
    tool = tool === "water" ? "dye" : "water";
    refreshBar();
  });
  waterBtn.dataset.role = "water";
  barEl.appendChild(waterBtn);

  const iceBtn = mkBtn("放冰", () => {
    tool = tool === "ice" ? "dye" : "ice";
    refreshBar();
    if (tool === "ice") toast("在布顶那条冰台上点按，放一块冰");
  });
  iceBtn.dataset.role = "ice";
  barEl.appendChild(iceBtn);

  barEl.appendChild(sepEl());

  const speedWrap = document.createElement("div");
  speedWrap.className = "speeds";
  [["‖", 0], ["1×", 1], ["2×", 2], ["4×", 4], ["8×", 8], ["16×", 16]].forEach(([label, v]) => {
    const b = document.createElement("button");
    b.className = "spd" + (v === speedMul ? " on" : "");
    b.textContent = label;
    b.dataset.spd = v;
    b.onclick = () => { setSpeed(v); };
    speedWrap.appendChild(b);
  });
  barEl.appendChild(speedWrap);

  barEl.appendChild(sepEl());

  const washBtn = mkBtn("清洗", () => {
    if (washT >= 0) return;
    washT = 0;
    toast("洗去浮色，颜色沉进布里");
  });
  washBtn.dataset.role = "wash";
  barEl.appendChild(washBtn);

  const saveBtn = mkBtn("存图", saveImage);
  barEl.appendChild(saveBtn);

  const resetBtn = mkBtn("重来", () => {
    for (let i = 0; i < NPX; i++) {
      dyeR[i] = 0; dyeG[i] = 0; dyeB[i] = 0;
      depR[i] = 0; depG[i] = 0; depB[i] = 0;
      pdr[i] = 0; pdg[i] = 0; pdb[i] = 0;
      wtr[i] = 0; wetMark[i] = 0;
    }
    specks.length = 0; drops.length = 0; ripples.length = 0;
    washed = false; washT = -1;
    seedScene();
    melting = false;
    speedMul = 1;
    refreshBar();
  });
  barEl.appendChild(resetBtn);

  refreshBar();
}

let openFam = -1;

function openSub(fi, btn) {
  openFam = fi;
  subEl.innerHTML = "";
  FAMILIES[fi].colors.forEach((hex, ci) => {
    const idx = fi * 6 + ci;
    const b = document.createElement("button");
    b.className = "sw" + (selectedDye === idx ? " on" : "");
    b.style.background = hex;
    b.style.color = hex;
    b.onclick = (ev) => {
      ev.stopPropagation();
      selectedDye = idx;
      tool = "dye";
      closeSub();
      refreshBar();
    };
    subEl.appendChild(b);
  });
  const r = btn.getBoundingClientRect();
  const cx = clamp(r.left + r.width / 2, 118, window.innerWidth - 118);
  subEl.style.left = Math.round(cx) + "px";
  subEl.style.bottom = Math.round(Math.max(70, window.innerHeight - r.top + 10)) + "px";
  subEl.classList.add("on");
}

function closeSub() {
  openFam = -1;
  subEl.classList.remove("on");
}

document.addEventListener("pointerdown", (e) => {
  if (openFam >= 0 && !subEl.contains(e.target)) closeSub();
});

function refreshBar() {
  barEl.querySelectorAll(".sw").forEach((el) => {
    const fi = Number(el.dataset.fam);
    const active = Math.floor(selectedDye / 6) === fi;
    const hex = active ? FAMILIES[fi].colors[selectedDye % 6] : FAMILIES[fi].colors[3];
    el.style.background = hex;
    el.style.color = hex;
    el.classList.toggle("on", active && tool === "dye");
  });
  const wb = barEl.querySelector('[data-role="water"]');
  if (wb) wb.classList.toggle("on", tool === "water");
  const ib = barEl.querySelector('[data-role="ice"]');
  if (ib) ib.classList.toggle("on", tool === "ice");
  barEl.querySelectorAll(".spd").forEach((el) => {
    el.classList.toggle("on", Number(el.dataset.spd) === speedMul);
  });
}

function sepEl() {
  const s = document.createElement("div");
  s.className = "sep";
  return s;
}
function mkBtn(text, fn) {
  const b = document.createElement("button");
  b.className = "btn";
  b.textContent = text;
  b.onclick = fn;
  return b;
}

function setSpeed(v) {
  speedMul = v;
  if (v > 0) melting = true;
  refreshBar();
}

function setMelting(on) {
  melting = on;
  if (on && speedMul === 0) speedMul = 1;
  refreshBar();
}

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2200);
}

function hideHint() {
  hintEl.classList.add("off");
}

function saveImage() {
  // 只导出布料区域
  const s = Math.min(3, 1400 / Math.max(cloth.w, cloth.h));
  const out = document.createElement("canvas");
  out.width = Math.round(cloth.w * s);
  out.height = Math.round(cloth.h * s);
  const g = out.getContext("2d");

  g.fillStyle = "#efe9dd";
  g.fillRect(0, 0, out.width, out.height);
  g.drawImage(clothTex, 0, 0, out.width, out.height);

  g.save();
  g.globalCompositeOperation = "multiply";
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = "high";
  g.drawImage(dyeCanvas, 0, 0, out.width, out.height);
  g.restore();

  g.globalCompositeOperation = "overlay";
  g.globalAlpha = 0.5;
  g.drawImage(sheenCanvas, 0, 0, out.width, out.height);
  g.globalAlpha = 1;
  g.globalCompositeOperation = "source-over";

  const a = document.createElement("a");
  a.download = "ice-dye-" + Date.now() + ".png";
  a.href = out.toDataURL("image/png");
  a.click();
  toast("已保存");
}

/* ────────────────────────────── 启动 ────────────────────────────── */
window.addEventListener("resize", () => {
  const oldTray = { ...tray };
  layout();
  layoutTray();
  if (oldTray.w > 0) {
    const sx = tray.w / oldTray.w, sy = tray.h / oldTray.h;
    for (const ice of ices) {
      ice.x = tray.x + (ice.x - oldTray.x) * sx;
      ice.y = tray.y + (ice.y - oldTray.y) * sy;
      ice.r0 *= Math.min(sx, sy);
    }
  }
});

layout();
seedScene();
buildBar();
requestAnimationFrame(frame);

// 调试接口
window.ICE = {
  field: { dyeR, dyeG, dyeB, depR, depG, depB, wtr },
  setSpeed, setMelting,
  get ices() { return ices; },
  get tray() { return tray; },
  get drops() { return drops; },
  dabDye, dabWater, addIceAt, addIce,
  tick(sec) {
    const step = 16.667;
    const n = Math.max(1, Math.round((sec * 1000) / step));
    for (let i = 0; i < n; i++) {
      updateIces(step);
      updateDrops(step);
      updateSpecks(step);
      stepField(1);
    }
    render();
    return { ices: ices.map((i) => +i.vol.toFixed(2)) };
  },
};
</script>
